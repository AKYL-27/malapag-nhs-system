<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My QR Code — Moto Monitor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<link rel="stylesheet" href="styles.css"/>
  <link rel="shortcut icon" href="../../images/mini-logo.png" />

</head>
<body>
<h1 class="sr-only">My QR Code for campus motorcycle entry and exit verification</h1>

<div class="overlay" id="overlay" onclick="closeMobileSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<main class="main" id="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" onclick="openMobileSidebar()" aria-label="Open menu">
        <i class="ti ti-menu-2" aria-hidden="true"></i>
      </button>
      <div class="topbar-titles">
        <div class="page-title">My QR Code</div>
        <div class="breadcrumb" id="topbarDate"></div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="notif-btn" aria-label="Notifications">
        <i class="ti ti-bell" style="font-size:18px;" aria-hidden="true"></i>
        <span class="notif-dot"></span>
      </div>
      <div class="user-chip">
        <div class="user-avatar" id="chipAvatar">--</div>
        <span class="user-name" id="chipName">Loading…</span>
        <i class="ti ti-chevron-down" style="font-size:13px;color:var(--text-hint);" aria-hidden="true"></i>
      </div>
    </div>
  </header>

  <div class="content" style="max-width:480px;margin:0 auto;">

    <div class="card">
      <div class="qr-wrap">
        <div class="qr-box" id="qrCanvas">
          <!-- QR rendered here by JS -->
        </div>
        <div class="qr-owner-name" id="qrOwnerName">Loading…</div>
        <div class="qr-owner-sub" id="qrPlate">Plate Number: —</div>

        <div class="qr-meta-row">
          <div class="qr-meta-chip"><i class="ti ti-id-badge" style="color:var(--blue-600);" aria-hidden="true"></i> <b>ID:</b> <span id="qrIdNumber">—</span></div>
          <div class="qr-meta-chip"><i class="ti ti-circle-check" style="color:var(--green-text);" aria-hidden="true"></i> <b>Status:</b> <span id="qrStatus">—</span></div>
        </div>

        <div id="qrNotice" style="display:none;margin:10px 0 0;font-size:12.5px;color:var(--amber-text);text-align:center;"></div>

        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-primary" id="dlBtn" onclick="downloadQR()" disabled><i class="ti ti-download" aria-hidden="true"></i> Download QR Code</button>
          <button class="btn btn-secondary" id="prBtn" onclick="printQR()" disabled><i class="ti ti-printer" aria-hidden="true"></i> Print QR Code</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;padding:16px 20px;display:flex;gap:12px;align-items:flex-start;">
      <i class="ti ti-info-circle" style="color:var(--blue-600);font-size:20px;flex-shrink:0;margin-top:1px;" aria-hidden="true"></i>
      <div style="font-size:12.5px;color:var(--text-muted);line-height:1.5;">
        Present this QR code to the security personnel at the gate for scanning upon entry and exit. Keep it accessible on your phone or print a copy to bring with you.
      </div>
    </div>

  </div>
</main>

<div class="scan-toast" id="scanToast" style="position:fixed;bottom:24px;right:24px;z-index:999;background:var(--text);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.2);transform:translateY(80px);opacity:0;transition:all .3s;max-width:300px;">
  <i class="ti ti-circle-check" style="font-size:18px;color:#6ee7b7;" aria-hidden="true"></i>
  <span id="toastMsg">Done</span>
</div>
<style>.scan-toast.show{transform:translateY(0)!important;opacity:1!important;}</style>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="sidebar.js"></script>
<script src="app.js"></script>
<script>renderSidebar('qrcode');</script>
<script>
// ── SIGNED-IN USER (saved by the student login page) ─────────
// Tries a few likely storage keys; adjust if your login uses a different one.
function getStoredUser() {
  const keys = ['user', 'currentUser', 'motoUser'];
  for (const store of [sessionStorage, localStorage]) {
    for (const k of keys) {
      try {
        const v = JSON.parse(store.getItem(k));
        if (v && v.id) return v;
      } catch (_) {}
    }
  }
  return null;
}

const user = getStoredUser();
if (!user) window.location.replace('login.html');

let qrDataUrl = ''; // filled once the QR is drawn

function initials(name) {
  const p = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '--';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}

function showToast(msg) {
  const t = document.getElementById('scanToast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showNotice(msg) {
  const el = document.getElementById('qrNotice');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

// ── LOAD MOTORCYCLE + DRAW QR ────────────────────────────────
async function generateQRCode() {
  document.getElementById('chipAvatar').textContent = initials(user.fullName);
  document.getElementById('chipName').textContent = user.fullName || 'User';
  document.getElementById('qrOwnerName').textContent = user.fullName || '—';
  document.getElementById('qrIdNumber').textContent = user.idNumber || '—';

  let motorcycles = [];
  try {
    const res = await fetch('/api/motorcycles?owner_id=' + encodeURIComponent(user.id));
    if (!res.ok) throw new Error('Request failed');
    motorcycles = await res.json();
  } catch (_) {
    document.getElementById('qrPlate').textContent = 'Could not load your motorcycle.';
    showToast('Could not reach the server.');
    return;
  }

  if (!motorcycles.length) {
    document.getElementById('qrPlate').textContent = 'No motorcycle registered yet.';
    document.getElementById('qrStatus').textContent = '—';
    showNotice('Add your motorcycle details to get a QR code.');
    return;
  }

  // Prefer an approved motorcycle if the user has more than one.
  const moto = motorcycles.find(m => m.status === 'Registered') || motorcycles[0];

  document.getElementById('qrPlate').textContent = 'Plate Number: ' + moto.plate;
  document.getElementById('qrStatus').textContent = moto.status;

  if (moto.status === 'Pending') {
    showNotice('Your motorcycle is pending approval. The gate will not allow entry until it is approved.');
  } else if (moto.status === 'Flagged') {
    showNotice('Your motorcycle is flagged. Please contact the security office.');
  }

  // This is exactly what the security scanner looks up.
  const payload = JSON.stringify({ motorcycle_id: moto.id, plate: moto.plate });

  const box = document.getElementById('qrCanvas');
  box.innerHTML = '';
  new QRCode(box, {
    text: payload,
    width: 200,
    height: 200,
    correctLevel: QRCode.CorrectLevel.M,
  });

  // qrcodejs draws a canvas, then fills an <img> a moment later.
  setTimeout(() => {
    const canvas = box.querySelector('canvas');
    const img = box.querySelector('img');
    qrDataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
    document.getElementById('dlBtn').disabled = !qrDataUrl;
    document.getElementById('prBtn').disabled = !qrDataUrl;
  }, 150);
}

// ── DOWNLOAD / PRINT ─────────────────────────────────────────
function downloadQR() {
  if (!qrDataUrl) return;
  const a = document.createElement('a');
  a.href = qrDataUrl;
  a.download = 'moto-monitor-qr.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function printQR() {
  if (!qrDataUrl) return;
  const w = window.open('', '_blank');
  if (!w) { showToast('Allow pop-ups to print.'); return; }
  const name = document.getElementById('qrOwnerName').textContent;
  const plate = document.getElementById('qrPlate').textContent;
  w.document.write(
    '<!DOCTYPE html><html><head><title>Moto Monitor QR</title></head>' +
    '<body style="font-family:sans-serif;text-align:center;padding:40px;">' +
    '<img src="' + qrDataUrl + '" width="300" height="300" alt="QR code"/>' +
    '<h2 style="margin:16px 0 4px;"></h2><p></p></body></html>'
  );
  w.document.querySelector('h2').textContent = name;
  w.document.querySelector('p').textContent = plate;
  w.document.close();
  w.onload = () => { w.focus(); w.print(); };
}

if (user) generateQRCode();
</script>
</body>
</html>
